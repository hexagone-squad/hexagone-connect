name: PR Quality Gates
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for applicable browser tests
        if: ${{ hashFiles('tests/e2e/**/*.e2e.spec.ts', 'tests/e2e/**/*.a11y.spec.ts') != '' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Deterministic validation
        run: pnpm run validate
      - name: Validate implementation-loop declaration
        run: pnpm run check:implementation-loop
      - name: Upload implementation-loop proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: implementation-loop-proof-${{ github.event.pull_request.number }}
          path: .ci-artifacts/implementation-loop/
          if-no-files-found: warn
      - name: Dependency vulnerability scan
        run: pnpm run check:dependency-vulnerabilities
